name: Validate application and contracts

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            worker/package-lock.json
            chain/package-lock.json
            web/package-lock.json
      - run: npm --prefix worker ci
      - run: npm --prefix chain ci
      - run: npm --prefix web ci
      - run: npm --prefix worker run types -- --check
      - run: npm run sync:chain
      - run: git diff --exit-code -- web/lib/chain-client.ts web/lib/chain-v2.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  native-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.94.1 --profile minimal
      - run: cargo +1.94.1 test --workspace --locked
        working-directory: contracts
